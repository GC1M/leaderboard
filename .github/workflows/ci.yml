name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Bundle for iOS and web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
        run: |
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform web --output-dir /tmp/export-web

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start
      - run: supabase test db
