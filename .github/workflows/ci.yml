name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Cancel superseded runs on the same ref, but never on main/develop so every merge keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

# Jobs run on GitHub's ubuntu runners unless the repository variable CI_RUNNER names another label. Set it to
# "self-hosted" to use the Mac runner when hosted minutes run out; delete it to switch back.
jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails if global coverage drops below the floor in package.json ("jest.coverageThreshold").
      - run: npm test -- --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              console.log('### Jest coverage\n\n| Metric | Covered | Total | % |\n| --- | --- | --- | --- |');
              for (const k of ['statements', 'branches', 'functions', 'lines']) console.log('| ' + k + ' | ' + t[k].covered + ' | ' + t[k].total + ' | ' + t[k].pct + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Bundle for iOS, Android and web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
        run: |
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform android --output-dir /tmp/export-android
          npx expo export --platform web --output-dir /tmp/export-web

  # Prebuilds android/ from app.config.ts and compiles every native module with Gradle. The only place Android
  # native code (Kotlin modules, config plugins) is compiled; debug variant, arm64 only, so no signing secrets.
  android:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          # Zulu downloads from Azul's CDN; the newest Temurin 17 asset on GitHub releases returns 504.
          distribution: zulu
          java-version: 17 # React Native 0.88 compiles with JDK 17
      - uses: gradle/actions/setup-gradle@v4
      # GitHub's ubuntu image ships the Android SDK; a self-hosted Mac may not.
      - if: runner.environment == 'self-hosted'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools # the default also asks for "tools", which current sdkmanager no longer has; Gradle fetches the rest
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Gradle assembleDebug
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  db:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/isolate-local-stack.sh
      - run: supabase start # applies every migration from scratch
      - run: supabase test db
      # src/lib/database.types.ts must be exactly what the migrations generate.
      - name: Generated types match src/lib/database.types.ts
        run: |
          supabase gen types typescript --local > database.types.generated.ts
          if ! diff -u src/lib/database.types.ts database.types.generated.ts > database.types.diff; then
            {
              echo "### database.types.ts is out of date"
              echo "Regenerate with: \`npx supabase@2.122.0 gen types typescript --local > src/lib/database.types.ts\`"
              echo '```diff'
              head -n 80 database.types.diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error file=src/lib/database.types.ts::Out of date with supabase/migrations. Regenerate and commit it."
            exit 1
          fi
      - name: Upload generated types
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types-generated
          path: |
            database.types.generated.ts
            database.types.diff
          if-no-files-found: ignore
          retention-days: 14
      # A self-hosted machine keeps containers between jobs; free them for the next job.
      - if: always() && runner.environment == 'self-hosted'
        run: supabase stop --no-backup

  # npm audit is report-only (findings go to the job summary); the gitleaks scan fails the job.
  supply-chain:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (production dependencies, high and above)
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          code=$?
          {
            echo "### npm audit (prod, high+): exit code $code"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          exit $code
      - name: Secrets scan (gitleaks)
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner --exit-code 2 \
            --report-format json --report-path /repo/gitleaks.json
          code=$?
          {
            echo "### gitleaks: exit code $code (0 = clean, 2 = leaks found)"
            if [ -s gitleaks.json ] && [ "$code" -ne 0 ]; then
              echo '```'
              node -e "for (const f of require('./gitleaks.json')) console.log(f.RuleID, f.File + ':' + f.StartLine, f.Commit.slice(0, 7))"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore
          retention-days: 14

  # Drives the real local stack (Postgres, GoTrue, PostgREST, RLS, RPCs) with two users.
  smoke-api:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/isolate-local-stack.sh
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit
      - name: API smoke test
        run: npm run smoke:api
      - name: Service logs on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}}  {{.Status}}'
          p=$(sed -n 's/^project_id = "\(.*\)"$/\1/p' supabase/config.toml)
          for c in supabase_auth_$p supabase_rest_$p supabase_db_$p; do
            echo "::group::$c"; docker logs --tail 80 "$c" 2>&1 || true; echo "::endgroup::"
          done
      - if: always() && runner.environment == 'self-hosted'
        run: supabase stop --no-backup

  # Exports the web build against the local stack and loads it in headless Chromium.
  smoke-web:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/isolate-local-stack.sh
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Export web build against the local stack
        run: |
          supabase status -o env > "$RUNNER_TEMP/stack.env"
          anon=$(sed -n 's/^ANON_KEY="\(.*\)"$/\1/p' "$RUNNER_TEMP/stack.env")
          api=$(sed -n 's/^API_URL="\(.*\)"$/\1/p' "$RUNNER_TEMP/stack.env")
          [ -n "$anon" ] && [ -n "$api" ] || { echo "::error::supabase status did not report ANON_KEY and API_URL"; exit 1; }
          echo "::add-mask::$anon"
          EXPO_PUBLIC_SUPABASE_URL="$api" EXPO_PUBLIC_SUPABASE_ANON_KEY="$anon" \
            npx expo export --platform web --output-dir dist
      - run: npx playwright install --with-deps chromium
      - name: Web smoke test
        run: npm run smoke:web
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-screenshots
          path: web-smoke-*.png
          if-no-files-found: ignore
          retention-days: 14
      - if: always() && runner.environment == 'self-hosted'
        run: supabase stop --no-backup

  # One status for branch protection: green only when every job above succeeded (skipped counts as not green).
  ci-ok:
    if: always()
    needs: [check, android, db, supply-chain, smoke-api, smoke-web]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::A required job did not succeed ($r)"; exit 1; }
          done
