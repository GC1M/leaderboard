name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Cancel superseded runs on the same ref, but never on main/develop so every merge keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails if global coverage drops below the floor in package.json ("jest.coverageThreshold").
      - run: npm test -- --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              console.log('### Jest coverage\n\n| Metric | Covered | Total | % |\n| --- | --- | --- | --- |');
              for (const k of ['statements', 'branches', 'functions', 'lines']) console.log('| ' + k + ' | ' + t[k].covered + ' | ' + t[k].total + ' | ' + t[k].pct + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Bundle for iOS and web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
        run: |
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform web --output-dir /tmp/export-web

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start
      - run: supabase test db

  # Report-only for now: findings show up in the job summary and as warnings, they do not fail the build.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (production dependencies, high and above)
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > audit.txt 2>&1
          code=$?
          {
            echo "### npm audit (prod, high+): exit code $code"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.txt
          exit $code
      - name: Secrets scan (gitleaks)
        continue-on-error: true
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner --exit-code 2 \
            --report-format json --report-path /repo/gitleaks.json
          code=$?
          {
            echo "### gitleaks: exit code $code (0 = clean, 2 = leaks found)"
            if [ -s gitleaks.json ] && [ "$code" -ne 0 ]; then
              echo '```'
              node -e "for (const f of require('./gitleaks.json')) console.log(f.RuleID, f.File + ':' + f.StartLine, f.Commit.slice(0, 7))"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.json
          if-no-files-found: ignore
          retention-days: 14
