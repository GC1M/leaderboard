name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Cancel superseded runs on the same ref, but never on main/develop so every merge keeps its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Fails if global coverage drops below the floor in package.json ("jest.coverageThreshold").
      - run: npm test -- --coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const t = require('./coverage/coverage-summary.json').total;
              console.log('### Jest coverage\n\n| Metric | Covered | Total | % |\n| --- | --- | --- | --- |');
              for (const k of ['statements', 'branches', 'functions', 'lines']) console.log('| ' + k + ' | ' + t[k].covered + ' | ' + t[k].total + ' | ' + t[k].pct + ' |');
            " >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Bundle for iOS and web
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-dummy
        run: |
          npx expo export --platform ios --output-dir /tmp/export-ios
          npx expo export --platform web --output-dir /tmp/export-web

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase start
      - run: supabase test db
