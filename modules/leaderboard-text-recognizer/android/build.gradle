plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.leaderboardtextrecognizer'
version = '1.0.0'

android {
  namespace "expo.modules.leaderboardtextrecognizer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Bundled Latin model: works offline with no first-run download, at the cost of a few MB per ABI in the APK.
  implementation "com.google.mlkit:text-recognition:16.0.1"
}
